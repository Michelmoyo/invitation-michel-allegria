<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Michel & Allegria — Organisateur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="config.js"></script>
<style>
  :root{
    --paper:#F4F4F4;--white:#FFFFFF;--ink:#111111;--ink-soft:#4A4A4A;--line:#D8D8D8;--page-bg:#E7E7E5;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--page-bg);color:var(--ink);font-family:'Poppins',Arial,sans-serif;
    display:flex;justify-content:center;padding:clamp(1rem,4vw,3rem) clamp(.75rem,3vw,2rem);
  }
  .admin-card{width:100%;max-width:640px;background:var(--white);box-shadow:0 30px 70px -25px rgba(0,0,0,.35);}
  .pin-gate{padding:clamp(2.5rem,8vw,4rem) clamp(1.5rem,6vw,2.5rem);text-align:center;}
  .pin-gate h1{font-size:1.3rem;font-weight:600;margin:0 0 .4rem;}
  .pin-gate p{font-size:.85rem;color:var(--ink-soft);margin:0 0 1.8rem;}
  .pin-input{
    width:100%;max-width:220px;font-family:'Poppins',Arial,sans-serif;font-size:1.4rem;letter-spacing:.5em;
    text-align:center;padding:.7rem .5rem .7rem 1em;border:1.4px solid var(--line);border-radius:8px;outline:none;
  }
  .pin-input:focus{border-color:var(--ink);}
  .pin-error{color:#B3261E;font-size:.82rem;margin-top:.8rem;min-height:1.2em;}
  .pin-submit{
    display:block;margin:1.4rem auto 0;background:var(--ink);color:#fff;border:none;border-radius:999px;
    padding:.8rem 2.2rem;font-family:'Poppins',Arial,sans-serif;font-size:.9rem;font-weight:500;cursor:pointer;
  }
  .admin-header{padding:1.6rem clamp(1.2rem,5vw,2rem) 0;}
  .admin-header h1{font-size:1.15rem;font-weight:600;margin:0 0 .9rem;}
  .back-link{font-size:.78rem;color:var(--ink-soft);text-decoration:none;}
  .tabs{display:flex;gap:.4rem;border-bottom:1px solid var(--line);}
  .tab-btn{
    flex:1;background:none;border:none;padding:.8rem .4rem;font-family:'Poppins',Arial,sans-serif;
    font-size:.78rem;font-weight:500;color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;
  }
  .tab-btn.active{color:var(--ink);border-bottom-color:var(--ink);}
  .tab-panel{display:none;padding:1.6rem clamp(1.2rem,5vw,2rem) 2.4rem;}
  .tab-panel.active{display:block;}
  .field{margin-bottom:1.1rem;}
  .field label{
    display:block;font-size:.72rem;font-weight:500;letter-spacing:.06em;text-transform:uppercase;
    color:var(--ink-soft);margin-bottom:.4rem;
  }
  .field input{
    width:100%;font-family:'Poppins',Arial,sans-serif;font-size:.95rem;padding:.65rem .75rem;
    border:1.4px solid var(--line);border-radius:8px;outline:none;
  }
  .field input:focus{border-color:var(--ink);}
  .btn{
    font-family:'Poppins',Arial,sans-serif;font-size:.88rem;font-weight:500;padding:.75rem 1.4rem;
    border-radius:999px;border:1.4px solid var(--ink);cursor:pointer;background:var(--ink);color:#fff;
  }
  .btn.ghost{background:var(--white);color:var(--ink);}
  .btn:disabled{opacity:.4;cursor:default;}
  .result-card{margin-top:1.6rem;padding:1.2rem;border:1.4px solid var(--line);border-radius:10px;display:none;}
  .result-card.show{display:block;}
  .result-card .r-name{font-weight:600;margin:0 0 .8rem;}
  .link-row{display:flex;gap:.5rem;margin-bottom:1rem;}
  .link-row input{flex:1;font-size:.78rem;padding:.55rem .6rem;border:1.4px solid var(--line);border-radius:8px;color:var(--ink-soft);}
  .link-row button{white-space:nowrap;}
  .result-qr{width:120px;height:120px;margin:0 auto;}
  .recent-list{margin-top:2rem;}
  .recent-list h3{
    font-size:.72rem;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 .8rem;
  }
  .recent-row{
    display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.6rem 0;
    border-top:1px solid var(--line);font-size:.85rem;
  }
  .recent-row .rn-name{font-weight:500;}
  .recent-row .rn-code{color:var(--ink-soft);font-size:.75rem;}
  .recent-row button{
    background:none;border:1.4px solid var(--line);border-radius:999px;padding:.3rem .8rem;font-size:.72rem;
    cursor:pointer;color:var(--ink);font-family:'Poppins',Arial,sans-serif;
  }
  .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;margin-bottom:1.8rem;}
  .stat-tile{border:1.4px solid var(--line);border-radius:10px;padding:.9rem .6rem;text-align:center;}
  .stat-tile .n{font-size:1.5rem;font-weight:600;font-variant-numeric:tabular-nums;}
  .stat-tile .l{font-size:.66rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;margin-top:.2rem;}
  .guest-table{width:100%;border-collapse:collapse;font-size:.82rem;}
  .guest-table th{
    text-align:left;font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);
    font-weight:500;padding:.4rem .3rem;border-bottom:1px solid var(--line);
  }
  .guest-table td{padding:.5rem .3rem;border-bottom:1px solid var(--line);}
  .pill{display:inline-block;padding:.15rem .55rem;border-radius:999px;font-size:.68rem;font-weight:500;}
  .pill.confirme{background:#E7F4EA;color:#1E7B34;}
  .pill.decline{background:#FBEAEA;color:#B3261E;}
  .pill.plus_tard{background:#F1F1F1;color:var(--ink-soft);}
  .pill.en_attente{background:#F1F1F1;color:var(--ink-soft);}
  .check-yes{color:#1E7B34;font-weight:600;}
  .check-no{color:var(--ink-soft);}
  .row-actions{display:flex;gap:.4rem;justify-content:flex-end;white-space:nowrap;}
  .row-actions button{
    background:none;border:1.4px solid var(--line);border-radius:999px;padding:.25rem .65rem;
    font-size:.68rem;cursor:pointer;color:var(--ink);font-family:'Poppins',Arial,sans-serif;
  }
  .row-actions button.danger{border-color:#F0C4C0;color:#B3261E;}
  .table-wrap{overflow-x:auto;}
  #scannerRegion{width:100%;max-width:340px;margin:0 auto;border-radius:10px;overflow:hidden;background:#000;}
  .scan-banner{margin:1.2rem 0;padding:.9rem 1rem;border-radius:10px;font-size:.9rem;font-weight:500;text-align:center;display:none;}
  .scan-banner.show{display:block;}
  .scan-banner.ok{background:#E7F4EA;color:#1E7B34;}
  .scan-banner.warn{background:#FFF4E0;color:#8A5A00;}
  .scan-banner.err{background:#FBEAEA;color:#B3261E;}
  .manual-row{display:flex;gap:.5rem;margin-top:1.4rem;}
  .manual-row input{
    flex:1;font-size:.85rem;padding:.6rem .7rem;border:1.4px solid var(--line);border-radius:8px;
  }
</style>
</head>
<body>

<div class="admin-card">

  <div class="pin-gate" id="pinGate">
    <h1>Espace organisateur</h1>
    <p>Entrez le code d'accès pour gérer les invités.</p>
    <input class="pin-input" id="pinInput" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="••••••">
    <p class="pin-error" id="pinError"></p>
    <button class="pin-submit" id="pinSubmit">Accéder</button>
  </div>

  <div id="adminConsole" style="display:none;">
    <div class="admin-header">
      <h1>Michel &amp; Allegria — Organisateur</h1>
      <p><a class="back-link" href="index.html">&larr; Voir l'invitation</a></p>
      <div class="tabs">
        <button class="tab-btn active" data-tab="add">Ajouter</button>
        <button class="tab-btn" data-tab="dash">Tableau de bord</button>
        <button class="tab-btn" data-tab="scan">Scanner</button>
      </div>
    </div>

    <div class="tab-panel active" id="panel-add">
      <div class="field">
        <label for="addNom">Nom de l'invité</label>
        <input id="addNom" type="text" placeholder="Ex. Madame Nkuna">
      </div>
      <div class="field">
        <label for="addAccomp">Accompagnants autorisés</label>
        <input id="addAccomp" type="number" min="0" value="0">
      </div>
      <button class="btn" id="addSubmit">Créer le lien</button>

      <div class="result-card" id="addResult">
        <p class="r-name" id="addResultName"></p>
        <div class="link-row">
          <input id="addResultLink" type="text" readonly>
          <button class="btn ghost" id="addResultCopy">Copier</button>
        </div>
        <div class="result-qr" id="addResultQr"></div>
      </div>

      <div class="recent-list">
        <h3>Derniers invités ajoutés</h3>
        <div id="recentRows"></div>
      </div>
    </div>

    <div class="tab-panel" id="panel-dash">
      <div class="stats-grid" id="statsGrid"></div>
      <div class="table-wrap">
        <table class="guest-table">
          <thead><tr><th>Nom</th><th>Statut</th><th>Présent</th><th></th></tr></thead>
          <tbody id="guestTableBody"></tbody>
        </table>
      </div>
    </div>

    <div class="tab-panel" id="panel-scan">
      <div id="scannerRegion"></div>
      <div class="scan-banner" id="scanBanner"></div>
      <div class="manual-row">
        <input id="manualCode" type="text" placeholder="Code invité (si le scan échoue)">
        <button class="btn" id="manualSubmit">Vérifier</button>
      </div>
    </div>

  </div>
</div>

<script>
const ORG_PIN = '08164';

const pinGate = document.getElementById('pinGate');
const pinInput = document.getElementById('pinInput');
const pinError = document.getElementById('pinError');
const pinSubmit = document.getElementById('pinSubmit');
const adminConsole = document.getElementById('adminConsole');

function unlock(){
  pinGate.style.display = 'none';
  adminConsole.style.display = '';
  try{ sessionStorage.setItem('organizer_pin_ok', '1'); }catch(e){}
  startAdminApp();
}
function tryPin(){
  if (pinInput.value === ORG_PIN){ unlock(); }
  else { pinError.textContent = 'Code incorrect.'; pinInput.value = ''; pinInput.focus(); }
}
pinSubmit.addEventListener('click', tryPin);
pinInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryPin(); });

let alreadyOk = false;
try{ alreadyOk = sessionStorage.getItem('organizer_pin_ok') === '1'; }catch(e){}
if (alreadyOk){ unlock(); }

function escapeHtml(s){
  return (s || '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function copyText(text, btn){
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => {
      if (btn){ const old = btn.textContent; btn.textContent = 'Copié !'; setTimeout(() => btn.textContent = old, 1500); }
    }).catch(() => {});
  }
}
function slugify(str){
  return (str || '').toString().normalize('NFD').replace(/[^\x00-\x7F]/g, '')
    .toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/(^-+|-+$)/g, '') || 'invite';
}
function randomSuffix(len){
  const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
  let s = '';
  for (let i = 0; i < len; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}

async function startAdminApp(){
  const sb = (window.SUPABASE_URL && window.SUPABASE_ANON_KEY)
    ? supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY)
    : null;

  const baseLink = window.location.origin + window.location.pathname.replace(/admin\.html$/, 'index.html');

  const tabBtns = Array.from(document.querySelectorAll('.tab-btn'));
  const panels = { add: document.getElementById('panel-add'), dash: document.getElementById('panel-dash'), scan: document.getElementById('panel-scan') };
  tabBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      tabBtns.forEach(b => b.classList.toggle('active', b === btn));
      Object.keys(panels).forEach(k => panels[k].classList.toggle('active', k === btn.dataset.tab));
      if (btn.dataset.tab === 'scan') startScanner(); else stopScanner();
      if (btn.dataset.tab === 'dash') loadDashboard();
    });
  });

  if (!sb){
    document.getElementById('recentRows').textContent = "Configuration Supabase manquante (config.js).";
    return;
  }

  const addNom = document.getElementById('addNom');
  const addAccomp = document.getElementById('addAccomp');
  const addSubmit = document.getElementById('addSubmit');
  const addResult = document.getElementById('addResult');
  const addResultName = document.getElementById('addResultName');
  const addResultLink = document.getElementById('addResultLink');
  const addResultCopy = document.getElementById('addResultCopy');
  const addResultQr = document.getElementById('addResultQr');
  const recentRows = document.getElementById('recentRows');

  async function refreshRecent(){
    const { data, error } = await sb.from('guests').select('*').order('date_ajout', { ascending: false }).limit(10);
    if (error || !data) return;
    recentRows.innerHTML = '';
    data.forEach(g => {
      const row = document.createElement('div');
      row.className = 'recent-row';
      const link = baseLink + '?g=' + encodeURIComponent(g.code);
      row.innerHTML =
        '<span><span class="rn-name">' + escapeHtml(g.nom || g.code) + '</span> ' +
        '<span class="rn-code">(' + escapeHtml(g.code) + ')</span></span>' +
        '<button data-link="' + link + '">Copier le lien</button>';
      recentRows.appendChild(row);
    });
    recentRows.querySelectorAll('button[data-link]').forEach(b => {
      b.addEventListener('click', () => copyText(b.dataset.link, b));
    });
  }

  addSubmit.addEventListener('click', async () => {
    const nom = addNom.value.trim();
    if (!nom){ addNom.focus(); return; }
    const accomp = parseInt(addAccomp.value, 10) || 0;
    addSubmit.disabled = true;
    const code = slugify(nom) + '-' + randomSuffix(4);
    const { error } = await sb.from('guests').insert({
      code, nom, accompagnants: accomp, statut: 'en_attente', checked_in: false
    });
    if (error){
      alert("Erreur lors de la création de l'invité.");
    } else {
      const link = baseLink + '?g=' + encodeURIComponent(code);
      addResultName.textContent = nom;
      addResultLink.value = link;
      addResult.classList.add('show');
      addResultQr.innerHTML = '';
      if (typeof QRCode !== 'undefined'){
        new QRCode(addResultQr, { text: link, width: 120, height: 120, colorDark: '#111111', colorLight: '#ffffff' });
      }
      addNom.value = '';
      addAccomp.value = '0';
      refreshRecent();
    }
    addSubmit.disabled = false;
  });
  addResultCopy.addEventListener('click', () => copyText(addResultLink.value, addResultCopy));
  refreshRecent();

  const statsGrid = document.getElementById('statsGrid');
  const guestTableBody = document.getElementById('guestTableBody');

  async function loadDashboard(){
    const { data, error } = await sb.from('guests').select('*').limit(500);
    if (error || !data) return;
    // Chaque ligne compte pour 1 + ses accompagnants (nombre réel de personnes).
    const headcount = g => 1 + (parseInt(g.accompagnants, 10) || 0);
    const counts = { confirme: 0, decline: 0, plus_tard: 0, en_attente: 0, present: 0 };
    let total = 0;
    data.forEach(g => {
      const n = headcount(g);
      total += n;
      const s = g.statut || 'en_attente';
      if (counts[s] !== undefined) counts[s] += n;
      if (g.checked_in) counts.present += n;
    });
    statsGrid.innerHTML = [
      ['Total', total], ['Confirmés', counts.confirme], ['En attente', counts.en_attente],
      ['Déclinés', counts.decline], ['À reconfirmer', counts.plus_tard], ['Présents', counts.present]
    ].map(([l, n]) => '<div class="stat-tile"><div class="n">' + n + '</div><div class="l">' + l + '</div></div>').join('');

    const statutLabel = { confirme: 'Confirmé', decline: 'Décliné', plus_tard: 'Plus tard', en_attente: 'En attente' };
    guestTableBody.innerHTML = data
      .slice()
      .sort((a, b) => (a.nom || '').localeCompare(b.nom || ''))
      .map(g => {
        const s = g.statut || 'en_attente';
        const accomp = parseInt(g.accompagnants, 10) || 0;
        const accompBadge = accomp > 0 ? ' <span class="rn-code">(+' + accomp + ')</span>' : '';
        return '<tr><td>' + escapeHtml(g.nom || g.code) + accompBadge + '</td>' +
          '<td><span class="pill ' + s + '">' + (statutLabel[s] || s) + '</span></td>' +
          '<td>' + (g.checked_in ? '<span class="check-yes">Oui</span>' : '<span class="check-no">—</span>') + '</td>' +
          '<td><div class="row-actions">' +
            '<button data-action="edit" data-code="' + escapeHtml(g.code) + '" data-nom="' + escapeHtml(g.nom || '') + '">Modifier</button>' +
            '<button data-action="delete" data-code="' + escapeHtml(g.code) + '" data-nom="' + escapeHtml(g.nom || g.code) + '" class="danger">Supprimer</button>' +
          '</div></td></tr>';
      }).join('');
  }

  guestTableBody.addEventListener('click', async (e) => {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const code = btn.dataset.code;

    if (btn.dataset.action === 'edit'){
      const current = btn.dataset.nom;
      const nextNom = prompt('Nouveau nom pour cet invité :', current);
      if (nextNom === null) return;
      const trimmed = nextNom.trim();
      if (!trimmed || trimmed === current) return;
      const { error } = await sb.from('guests').update({ nom: trimmed }).eq('code', code);
      if (error){ alert("La modification n'a pas pu être enregistrée."); return; }
      loadDashboard();
      refreshRecent();
    }

    if (btn.dataset.action === 'delete'){
      const ok = confirm('Supprimer définitivement "' + btn.dataset.nom + '" ? Son lien et son QR ne fonctionneront plus.');
      if (!ok) return;
      const { error } = await sb.from('guests').delete().eq('code', code);
      if (error){ alert("La suppression n'a pas pu être effectuée."); return; }
      loadDashboard();
      refreshRecent();
    }
  });

  sb.channel('guests-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'guests' }, () => {
      if (document.getElementById('panel-dash').classList.contains('active')) loadDashboard();
    })
    .subscribe();

  let html5QrCode = null;
  let scanLock = false;
  const scanBanner = document.getElementById('scanBanner');

  function showScanResult(kind, text){
    scanBanner.className = 'scan-banner show ' + kind;
    scanBanner.textContent = text;
  }
  function extractCode(text){
    try{ const u = new URL(text); const g = u.searchParams.get('g'); if (g) return g; }catch(e){}
    return text.trim();
  }
  async function checkInGuest(code){
    if (!code) return;
    const { data, error } = await sb.from('guests').select('*').eq('code', code).maybeSingle();
    if (error || !data){ showScanResult('err', 'Invité inconnu (' + code + ')'); return; }
    if (data.checked_in){
      const t = data.checked_in_at ? new Date(data.checked_in_at).toLocaleTimeString('fr-FR') : '';
      showScanResult('warn', 'Déjà enregistré — ' + (data.nom || code) + (t ? ' (' + t + ')' : ''));
      return;
    }
    const { error: upErr } = await sb.from('guests').update({ checked_in: true, checked_in_at: new Date().toISOString() }).eq('code', code);
    if (upErr){ showScanResult('err', 'Erreur de vérification.'); return; }
    if (data.statut !== 'confirme'){ showScanResult('warn', 'Non confirmé — ' + (data.nom || code)); }
    else { showScanResult('ok', 'Bienvenue ' + (data.nom || code)); }
  }
  function onScanSuccess(decodedText){
    if (scanLock) return;
    scanLock = true;
    checkInGuest(extractCode(decodedText)).finally(() => setTimeout(() => { scanLock = false; }, 2500));
  }
  function startScanner(){
    if (html5QrCode || typeof Html5Qrcode === 'undefined') return;
    html5QrCode = new Html5Qrcode('scannerRegion');
    html5QrCode.start({ facingMode: 'environment' }, { fps: 10, qrbox: 230 }, onScanSuccess, () => {})
      .catch(() => showScanResult('err', 'Caméra indisponible — utilisez la vérification manuelle.'));
  }
  function stopScanner(){
    if (html5QrCode){
      const inst = html5QrCode; html5QrCode = null;
      inst.stop().then(() => inst.clear()).catch(() => {});
    }
  }
  document.getElementById('manualSubmit').addEventListener('click', () => {
    const v = document.getElementById('manualCode').value.trim();
    if (v) checkInGuest(v);
  });
}
</script>
</body>
</html>
